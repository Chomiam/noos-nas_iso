name: "Build and Release ISO"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version du tag (ex: v0.2.6)"
        required: true
        default: "v0.2.6"

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Compiler et Publier l'ISO"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ❄️ Installation de Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: ⚡ Configuration Cachix (steveos)
        uses: cachix/cachix-action@v17
        with:
          name: steveos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 🔨 Compilation de l'Image ISO Noos
        run: |
          nix build .#iso --print-out-paths

      - name: 📦 Préparation des fichiers d'artefacts
        id: prep
        run: |
          mkdir -p release-assets
          ISO_PATH=$(ls result/iso/*.iso | head -n1)
          cp "$ISO_PATH" release-assets/noos-nas-installer.iso
          cd release-assets
          sha256sum noos-nas-installer.iso > noos-nas-installer.iso.sha256
          echo "SHA256=$(cat noos-nas-installer.iso.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Création / Publication de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.TAG }}
          name: "Noos NAS Edition Installer ${{ steps.prep.outputs.TAG }}"
          body: |
            ## 🚀 Noos NAS Edition — Installateur Réseau Headless (${{ steps.prep.outputs.TAG }})

            Image ISO minimale bootable pour l'installation automatisée de **Noos NAS Edition**.

            ### 📋 Nouveautés & Correctifs :
            - 🔌 **Compatibilité Rufus Windows (mode Image ISO FAT32/exFAT/NTFS & mode DD)** : ajout des pilotes noyau `vfat`, `fat`, `nls_cp437`, `nls_iso8859_1`, `exfat`, `ntfs3` dans l'`initrd` (corrige `Failed to mount /sysroot/iso` au boot USB)
            - 📐 **Partitionnement GPT 100 % sans espace non alloué** : la partition `BOOT` (`pno=1`, 1 Gio) démarre toujours au secteur `2048` (1 Mio) et `ROOT` (`pno=2`) occupe l'intégralité du reste du disque
            - 🌲 **Sous-volume Btrfs `@` par défaut** : définition automatique de `@` comme sous-volume par défaut de la partition racine Btrfs (`btrfs subvolume set-default /mnt/@`)
            - 🔧 **Synchronisation forcée des partitions noyau (`BLKPG` / `partx` / `resizepart` / `addpart`)** et démontage synchrone avant `wipefs` / `sgdisk`
            - 🎨 **Thème de démarrage GRUB Catppuccin Mocha** avec le logo Noos HD
            - ⚡ **Installateur Web réseau (`noos-web-installer`)** avec détection automatique de l'IP LAN

            ### 💾 Fichiers & Vérification d'intégrité :
            - **Fichier ISO** : `noos-nas-installer.iso`
            - **Empreinte SHA-256** : `${{ steps.prep.outputs.SHA256 }}`
          files: |
            release-assets/noos-nas-installer.iso
            release-assets/noos-nas-installer.iso.sha256
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
