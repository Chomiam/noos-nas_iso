name: "Build and Release ISO"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version du tag (ex: v0.2.2)"
        required: true
        default: "v0.2.2"

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Compiler et Publier l'ISO"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ❄️ Installation de Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: ⚡ Configuration Cachix (steveos)
        uses: cachix/cachix-action@v17
        with:
          name: steveos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 🔨 Compilation de l'Image ISO Noos
        run: |
          nix build .#iso --print-out-paths

      - name: 📦 Préparation des fichiers d'artefacts
        id: prep
        run: |
          mkdir -p release-assets
          ISO_PATH=$(ls result/iso/*.iso | head -n1)
          cp "$ISO_PATH" release-assets/noos-nas-installer.iso
          cp "$ISO_PATH" release-assets/steveos-nas-installer.iso
          cd release-assets
          sha256sum noos-nas-installer.iso > noos-nas-installer.iso.sha256
          sha256sum steveos-nas-installer.iso > steveos-nas-installer.iso.sha256
          echo "SHA256=$(cat steveos-nas-installer.iso.sha256 | awk '{print $1}')" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Création / Publication de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.TAG }}
          name: "Noos NAS Edition Installer ${{ steps.prep.outputs.TAG }}"
          body: |
            ## 🚀 Noos NAS Edition — Installateur Réseau Headless (${{ steps.prep.outputs.TAG }})

            Image ISO minimale bootable pour l'installation automatisée de **Noos NAS Edition**.

            ### 📋 Nouveautés & Correctifs :
            - 🔧 **Synchronisation forcée des partitions noyau (`BLKPG` / `partx` / `partprobe` / `resizepart` / `addpart`)** corrigeant l'erreur d'absence de la partition racine (`/dev/sdX2`) lors du formatage Btrfs et Ext4
            - 🧹 **Libération approfondie du disque cible** avant partitionnement (démontage récursif, holders LVM/DM/RAID, nettoyage `wipefs` par partition et séparation `sgdisk -Z` / `sgdisk -o`)
            - 🚀 **Rebranding officiel complet vers Noos NAS Edition**
            - 🎨 **Thème de démarrage GRUB Catppuccin Mocha** avec le logo Noos HD
            - ⚡ **Installateur Web réseau (`noos-web-installer`)** avec détection automatique de l'IP LAN
            - 🔄 **Mise à jour en direct** depuis GitHub avec déploiement automatique

            ### 💾 Fichiers & Vérification d'intégrité :
            - **Fichier ISO principal** : `noos-nas-installer.iso`
            - **Fichier ISO rétrocompatible** : `steveos-nas-installer.iso`
            - **Empreinte SHA-256** : `${{ steps.prep.outputs.SHA256 }}`
          files: |
            release-assets/noos-nas-installer.iso
            release-assets/noos-nas-installer.iso.sha256
            release-assets/steveos-nas-installer.iso
            release-assets/steveos-nas-installer.iso.sha256
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
